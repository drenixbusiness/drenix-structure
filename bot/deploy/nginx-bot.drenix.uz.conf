# /etc/nginx/sites-available/bot.drenix.uz  →  ln -s to sites-enabled, then: certbot --nginx -d bot.drenix.uz
server {
    listen 80;
    server_name bot.drenix.uz;

    # only the two endpoints the website needs are exposed
    location = /job-request {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 64k;
    }
    location = /health {
        proxy_pass http://127.0.0.1:4000;
    }
    location / {
        return 404;
    }
}
